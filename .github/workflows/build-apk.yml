name: Build Internet Khata APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web files to Android
        run: npx cap sync android

      - name: Use logo as app icon (all densities)
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true
          if [ -f www/logo-512.png ]; then
            for d in android/app/src/main/res/mipmap-*/; do
              if [ -d "$d" ]; then
                cp www/logo-512.png "$d/ic_launcher.png" || true
                cp www/logo-512.png "$d/ic_launcher_round.png" || true
              fi
            done
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: internet-khata-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
